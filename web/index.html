<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrophysics Lab Viewport</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="app-container">
        <main class="viewport-container">
            <canvas id="simCanvas"></canvas>

            <div class="timeline-container" style="max-width: 100%; display: flex; align-items: center; gap: 12px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #1e293b;">
                <span style="font-family: monospace; font-size: 0.85rem; color: #94a3b8; min-width: 60px;">Timeline:</span>
                <input type="range" id="timeSlider" min="0" max="0" value="0" disabled style="flex: 1; cursor: not-allowed; accent-color: #38bdf8;">
                <span id="sliderIndexDisplay" style="font-family: monospace; font-size: 0.85rem; color: #f59e0b; min-width: 40px; text-align: right;">0/0</span>
            </div>
        </main>

        <aside class="control-panel">
            <h2>🌌 Cosmic Control</h2>
            <div class="status-indicator">
                Status: <span id="connectionStatus" class="disconnected">Disconnected</span>
            </div>

            <hr class="divider">

            <div class="button-group">
                <button id="playBtn" class="btn btn-success">▶ Play Simulation</button>
                <button id="pauseBtn" class="btn btn-danger">⏸ Pause</button>
                <button id="historyBtn" class="btn btn-primary">🕒 Fetch History</button>
            </div>

            <div class="stats-panel">
                <h3>📊 Live Telemetry</h3>
                <p>Frame: <span id="telemetryFrame">0</span></p>
                <p>Sim Time: <span id="telemetryTime">0.000</span></p>
                <p>Active Bodies: <span id="telemetryBodies">0</span></p>
            </div>
        </aside>
    </div>

    <script src="src/app.js"></script>
</body>
</html>

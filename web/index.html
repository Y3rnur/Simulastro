<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrophysics Lab Viewport</title>
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <div class="app-container">
        <main class="viewport-container">
            <canvas id="simCanvas"></canvas>

            <div class="canvas-controls-overlay">
                <div class="timeline-container" style="max-width: 100%; display: flex; align-items: center; gap: 12px; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #1e293b;">
                    <span style="font-family: monospace; font-size: 0.85rem; color: #94a3b8; min-width: 60px;">Timeline:</span>
                    <input type="range" id="timeSlider" min="0" max="0" value="0" disabled style="flex: 1; cursor: not-allowed; accent-color: #38bdf8;">
                    <span id="sliderIndexDisplay" style="font-family: monospace; font-size: 0.85rem; color: #f59e0b; min-width: 40px; text-align: right;">0/0</span>
                </div>

                <div class="speed-control">
                    <label for="speedSlider">Speed:</label>
                    <input id="speedSlider" type="range" min="0.1" max="25" step="0.1" value="1" />
                    <span id="speedLabel">1.0x</span>
                    <div class="preset-buttons">
                        <button data-speed="0.1">0.1x</button>
                        <button data-speed="1.0">1x</button>
                        <button data-speed="10.0">10x</button>
                        <button data-speed="25.0">25x</button>
                    </div>
                </div>

                <div class="placement-panel" style="margin-top:12px; background:#071024; padding:10px; border-radius:8px; border:1px solid #1e293b;">
                    <label><input id="placementToggle" type="checkbox" checked> Placement Mode</label>

                    <div id="placementControls" style="margin-top:8px;">
                        <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                            <label style="min-width:60px; font-size:0.9rem;">Mass (log10):</label>
                            <input id="massSlider" type="range" min="-3" max="12" step="0.1" value="6" style="flex:1;">
                            <span id="massLabel" style="width:70px; text-align:right; font-family:monospace;">1e6</span>
                        </div>
                        <div style="display:flex; gap:8px; align-items:center; margin-top:8px;">
                            <label style="min-width:60px; font-size:0.9rem;">Vel scale:</label>
                            <input id="velocityScale" type="number" value="0.01" step="0.005" style="width:80px;">
                            <button id="clearPlacementBtn" class="btn">Clear</button>
                            <button id="uploadSceneBtn" class="btn btn-primary">Upload Scene</button>
                        </div>
                        <div style="margin-top:8px; font-size:0.85rem; color:#94a3b8;">Click once to place, click again to set velocity.</div>
                    </div>
                </div>
            </div>
        </main>

        <aside class="control-panel">
            <h2>🌌 Cosmic Control</h2>
            <div class="status-indicator">
                Status: <span id="connectionStatus" class="disconnected">Disconnected</span>
            </div>

            <hr class="divider">

            <div class="button-group">
                <button id="playBtn" class="btn btn-success">▶ Play Simulation</button>
                <button id="pauseBtn" class="btn btn-danger">⏸ Pause</button>
                <button id="historyBtn" class="btn btn-primary">🕒 Fetch History</button>
            </div>

            <div class="stats-panel">
                <h3>📊 Live Telemetry</h3>
                <p>Frame: <span id="telemetryFrame">0</span></p>
                <p>Sim Time: <span id="telemetryTime">0.000</span></p>
                <p>Active Bodies: <span id="telemetryBodies">0</span></p>
            </div>
        </aside>
    </div>

    <script src="src/app.js"></script>
</body>
</html>
